<!DOCTYPE html>

  <head>

    <meta name="theme-color" content="#0B5A70" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta property="og:title" content="संकीर्तन — भजन से भगवान तक" />

    <meta property="og:image:height" content="630" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- Fonts: Inter (Latin) + Noto Sans Devanagari (Hindi). display=swap keeps first paint fast. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet" />
    <title>संकीर्तन — भजन से भगवान तक</title>

         first paint; deferred scripts run in order, before the app bundle.
         Analytics SDK dropped (S63): it was loaded but never used. -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <script defer src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
